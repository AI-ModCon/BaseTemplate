name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: vars.ENABLE_PYPI_PUBLISH == 'true' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.release.tag_name }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

    - name: Check lock
      run: uv lock --check

    - name: Build package
      run: uv build

    - name: Store distributions
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: distributions
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Retrieve distributions
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: distributions
        path: dist/

    - name: Publish to PyPI with Trusted Publishing
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      with:
        packages-dir: dist/
