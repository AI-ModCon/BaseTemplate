name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      check_external_urls:
        description: Check external documentation URLs (advisory only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Check spelling
      uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      with:
        files: '*.md docs/'

    - name: Check local documentation links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
      with:
        args: --offline --include-fragments=anchor-only --no-progress '*.md' 'docs/**/*.md'

    - name: Check external documentation URLs
      if: github.event_name == 'workflow_dispatch' && inputs.check_external_urls
      continue-on-error: true
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
      with:
        fail: false
        args: --exclude-all-private --timeout 20 --max-retries 2 --no-progress '*.md' 'docs/**/*.md'

  check-lock:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

    - name: Check uv.lock is up-to-date
      run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      with:
        enable-cache: true

    - name: Sync dependencies
      run: uv sync --locked --group dev

    - name: Lint with ruff
      run: uv run --locked ruff check .

    - name: Format check with ruff
      run: uv run --locked ruff format . --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      with:
        enable-cache: true

    - name: Sync dependencies
      run: uv sync --locked --group test

    - name: Run tests with pytest
      run: uv run --locked pytest --cov=basetemplate --cov-report=xml

    - name: Upload coverage to Codecov
      if: vars.ENABLE_CODECOV == 'true'
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
