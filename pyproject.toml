[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basetemplate"
version = "1.0.0"
description = "A template repository for ModCon base team projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "ModCon Base Team", email = "modcon-base-code@lbl.gov"}
]
keywords = [
    "template",
    "repository",
    "modcon",
    "best-practices"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.urls]
Repository = "https://github.com/AI-ModCon/BaseTemplate"
Documentation = "https://github.com/AI-ModCon/BaseTemplate"
"Issue Tracker" = "https://github.com/AI-ModCon/BaseTemplate/issues"

[tool.setuptools]
packages = ["basetemplate"]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=basetemplate --cov-report=html --cov-report=term-missing"
